<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be mine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#5b2c3e;
    --wine:#8c3a52;
    --rosewood:#c15b71;
    --petal:#f7d9de;
    --blush:#fbe9ec;
    --parchment:#fdf6f2;
    --gold:#c9975a;
    --gold-light:#e7c793;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(193,91,113,.18), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(201,151,90,.16), transparent 50%),
      linear-gradient(180deg, var(--parchment) 0%, var(--blush) 100%);
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--plum);
    overflow:hidden;
    position:relative;
  }

  /* falling petals */
  .petal{
    position:absolute;
    top:-8%;
    opacity:.5;
    pointer-events:none;
    user-select:none;
    animation:fall linear infinite;
    color:var(--rosewood);
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(340deg); }
  }

  .card{
    position:relative;
    background:var(--parchment);
    border-radius:6px;
    padding:56px 48px 44px;
    max-width:460px;
    width:100%;
    text-align:center;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 70px -15px rgba(91,44,62,.35);
    border:1px solid rgba(201,151,90,.35);
  }

  .card::before,
  .card::after{
    content:"";
    position:absolute;
    width:34px;
    height:34px;
    border:1.5px solid var(--gold);
    opacity:.55;
  }
  .card::before{ top:14px; left:14px; border-right:none; border-bottom:none; }
  .card::after{ bottom:14px; right:14px; border-left:none; border-top:none; }

  .eyebrow{
    font-family:'Petit Formal Script', cursive;
    font-size:1.7rem;
    color:var(--rosewood);
    margin:0 0 2px;
    font-weight:400;
    letter-spacing:.5px;
  }

  h1{
    font-size:2.35rem;
    line-height:1.2;
    margin:2px 0 10px;
    color:var(--plum);
    font-weight:600;
    letter-spacing:.2px;
  }

  .divider{
    width:64px;
    height:1px;
    margin:14px auto 18px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .sub{
    font-size:1.12rem;
    font-style:italic;
    color:var(--wine);
    margin:0 0 30px;
    min-height:1.5em;
    transition:opacity .2s ease;
  }

  .frame{
    width:230px;
    height:230px;
    margin:0 auto 32px;
    padding:8px;
    background:var(--parchment);
    border:1px solid var(--gold-light);
    box-shadow:0 14px 30px -10px rgba(91,44,62,.3);
    position:relative;
  }
  .frame::before{
    content:"";
    position:absolute;
    inset:3px;
    border:1px solid rgba(201,151,90,.5);
    pointer-events:none;
  }
  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .buttons{
    position:relative;
    display:flex;
    gap:16px;
    justify-content:center;
    align-items:center;
    min-height:58px;
  }

  button{
    font-family:'Cormorant Garamond', serif;
    font-size:1.15rem;
    letter-spacing:.5px;
    padding:13px 34px;
    border-radius:2px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  button:active{ transform:scale(.96); }

  .yes-btn{
    background:var(--wine);
    color:var(--parchment);
    border:1px solid var(--wine);
    box-shadow:0 8px 20px -6px rgba(140,58,82,.55);
  }
  .yes-btn:hover{ background:var(--plum); border-color:var(--plum); transform:translateY(-2px); }

  .no-btn{
    background:transparent;
    color:var(--rosewood);
    border:1px solid var(--rosewood);
  }
  .no-btn.roaming{
    position:fixed;
    z-index:5;
  }

  .reveal{ display:none; }
  .reveal.show{ display:block; animation:riseIn .5s ease both; }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .ask.hide{ display:none; }

  footer{
    margin-top:26px;
    font-size:.86rem;
    font-style:italic;
    color:#b98d99;
  }

  @media (max-width:460px){
    .card{ padding:42px 26px 34px; }
    .frame{ width:180px; height:180px; }
    h1{ font-size:1.9rem; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="ask" class="ask">
    <p class="eyebrow">a small question</p>
    <h1>Will you be mine?</h1>

  const glyphs = ['❤','✦','♡'];
  for(let i=0;i<16;i++){
    const p = document.createElement('div');
    p.className='petal';
    p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    p.style.left = Math.random()*100+'vw';
    p.style.animationDuration = (9+Math.random()*10)+'s';
    p.style.animationDelay = (Math.random()*10)+'s';
    p.style.fontSize = (12+Math.random()*14)+'px';
    document.body.appendChild(p);
  }

  const messages = [
    "Are you sure?",
    "Really sure?",
    "Are you positive?",
    "Please...",
    "Just think about it.",
    "I'll be a little sad.",
    "Quite sad, actually.",
    "Very, very sad.",
    "Fine, I'll stop asking.",
    "Kidding — say yes?"
  ];
  let msgIndex = 0;

  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.querySelector('.yes-btn');
  const subtext = document.getElementById('subtext');

  function moveNoButton(){
    const rect = noBtn.getBoundingClientRect();
    if(!noBtn.classList.contains('roaming')){
      noBtn.classList.add('roaming');
      noBtn.style.left = rect.left+'px';
      noBtn.style.top = rect.top+'px';
    }
    const w = noBtn.offsetWidth;
    const h = noBtn.offsetHeight;
    const maxX = window.innerWidth - w - 16;
    const maxY = window.innerHeight - h - 16;
    noBtn.style.left = Math.max(16, Math.random()*maxX)+'px';
    noBtn.style.top = Math.max(16, Math.random()*maxY)+'px';
  }

  function growYes(){
    const size = parseFloat(window.getComputedStyle(yesBtn).fontSize);
    yesBtn.style.fontSize = Math.min(size*1.14, 42)+'px';
  }

  function nudge(e){
    e.preventDefault();
    moveNoButton();
    subtext.style.opacity = 0;
    setTimeout(()=>{
      subtext.textContent = messages[msgIndex];
      msgIndex = (msgIndex+1) % messages.length;
      subtext.style.opacity = 1;
    },120);
    growYes();
  }

  noBtn.addEventListener('mouseenter', nudge);
  noBtn.addEventListener('click', nudge);
  noBtn.addEventListener('touchstart', nudge);

  function sayYes(){
    document.getElementById('ask').classList.add('hide');
    document.getElementById('reveal').classList.add('show');
  }
</script>

</body>
</html>
